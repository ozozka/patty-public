    C 120 172 140 170 150 162
    C 158 156 158 144 158 112
    C 158 90 156 78 150 58
    C 146 46 138 42 130 48
    C 120 56 110 64 100 64
    C 90 64 80 56 70 48
    C 62 42 54 46 50 58
    C 44 78 42 90 42 112
