name: CI/CD Pipeline

on:
  push:
    branches: [master]

jobs:
  # 0. Path Filter
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'packages/config/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - 'packages/contracts/**'
              - 'packages/config/**'
              - 'packages/assets/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'packages/config/**'
              - 'packages/assets/**'
              - '.github/workflows/ci.yml'
          token: ${{ secrets.PERSONAL_TOKEN }}
          list-files: none
          initial-fetch-depth: 100

  # 1. API CI
  api-ci:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: pati
          POSTGRES_PASSWORD: pati
          POSTGRES_DB: pati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgres://pati:pati@localhost:5432/pati_test"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "test-secret-key-that-is-at-least-32-characters-long"
      ADMIN_JWT_SECRET: "test-admin-secret-key-that-is-at-least-32-ch"
      CLOUDINARY_CLOUD_NAME: "test"
      CLOUDINARY_API_KEY: "test"
      CLOUDINARY_API_SECRET: "test"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run API Gate
        run: just api gate

  # 2. Mobile CI
  mobile-ci:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BASE_URL: "http://localhost:8080/api/v1/"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Mobile Gate
        run: just mobile gate

  # 3. Web CI
  web-ci:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      API_INTERNAL_URL: "http://localhost:8080"
      ADMIN_JWT_SECRET: "test-admin-secret-key-that-is-at-least-32-chars"
      NEXT_PUBLIC_APP_STORE_URL: "https://apps.apple.com"
      NEXT_PUBLIC_PLAY_STORE_URL: "https://play.google.com"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Web Gate
        run: just web gate

  # 4. Deploy API to Railway (Only on Master)
  deploy-api:
    needs: [changes, api-ci]
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      needs.changes.outputs.api == 'true' &&
      needs.api-ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10

      - name: Install Railway CLI
        run: bun install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service patty-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # 5. Deploy Web to Railway (Only on Master)
  deploy-web:
    needs: [changes, web-ci]
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      needs.changes.outputs.web == 'true' &&
      needs.web-ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10

      - name: Install Railway CLI
        run: bun install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service patty-web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # 6. Deploy Mobile OTA Update (Only on Master)
  deploy-mobile:
    needs: [changes, mobile-ci]
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      needs.changes.outputs.mobile == 'true' &&
      needs.mobile-ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Shared Packages
        run: bunx turbo run build --filter @patty/contracts --filter @patty/assets

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA Update
        run: bunx eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_BASE_URL: ${{ secrets.EXPO_PUBLIC_BASE_URL }}
